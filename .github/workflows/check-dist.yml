# `dist/index.js` is a special file in Actions.
# When you reference an action with `uses:` in a workflow,
# `index.js` is the code that will run.
# For our project, we generate this file through a build process
# from other source files.
# We need to make sure the checked-in `index.js` actually matches what we expect it to be.
name: Check dist/
permissions:
  id-token: write
  contents: read

on:
  push:
    branches:
      - main
      - feature/**
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  # Gitleaks secret detection
  secret_detection:
    name: Gitleaks secret detection
    runs-on:
      - ubuntu-latest
    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - name: Detect leaks
        run: |
          docker run --rm \
            -v $(pwd):/repo \
            -v $(pwd)/.gitleaks.toml:/repo/.gitleaks.toml \
            zricethezav/gitleaks:latest detect \
            --source="/repo" \
            --verbose \
            --redact \
            --config="/repo/.gitleaks.toml"

  check-dist:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Nodejs
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version-file: package.json
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Move the committed index.js file
        run: mv dist/index.cjs /tmp

      - name: Rebuild with tsc
        run: npm run build

      - name: Rebuild the index.cjs file
        run: npm run release

      - name: Compare the expected and actual index.js files
        run: git diff --ignore-all-space dist/index.cjs /tmp/index.cjs
        id: diff

      # If index.js was different from expected, upload the expected version as an artifact
      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        if: ${{ failure() && steps.diff.conclusion == 'failure' }}
        with:
          name: index.cjs
          path: dist/index.cjs
          overwrite: true
